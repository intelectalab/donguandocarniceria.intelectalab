<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aycha">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8284C"/>
      <stop offset="0.55" stop-color="#7A1736"/>
      <stop offset="1" stop-color="#4F0B20"/>
    </linearGradient>
  </defs>
  <!-- Cuadro con el degradado vino de la casa -->
  <rect width="64" height="64" rx="15" fill="url(#fondo)"/>
  <!-- La «A» de Aycha -->
  <path d="M32 11 L50 52 H41.5 L32 29.5 L22.5 52 H14 Z" fill="#FFF4E6"/>
